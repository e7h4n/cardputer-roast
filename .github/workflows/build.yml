name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per ref at a time: two quick merges to main publish their releases in order (the newer one is latest).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version counts the commits on main

      - name: Fetch components
        run: |
          git config --global --add safe.directory '*'
          python3 fetch_repos.py

      # Version: a v* tag as it is; every push to main is a release v0.3.<commits on main>, which the firmware's
      # update check compares with its own (roast_update.h); anything else (PRs) is the short hash, not a release.
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then ver="v0.3.$(git rev-list --count HEAD)"
          else ver="$(git rev-parse --short HEAD)"; fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "version ${ver}"

      - name: Build
        shell: bash
        env:
          ROAST_VERSION: ${{ steps.ver.outputs.ver }}
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Package Launcher app image
        id: pkg
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.ver }}"
          bin="cardputer-roast-${ver}.bin"
          mkdir -p dist
          cp build/cardputer-roast.bin "dist/${bin}"
          (cd dist && sha256sum *.bin > SHA256SUMS)
          cat dist/SHA256SUMS
          # what the firmware's update check reads (releases/latest/download/latest.json)
          printf '{"version":"%s","bin":"%s","size":%d,"sha256":"%s"}\n' "$ver" "$bin" \
            "$(stat -c %s "dist/${bin}")" "$(sha256sum "dist/${bin}" | cut -d' ' -f1)" > dist/latest.json
          cat dist/latest.json
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Unit tests (host)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/tests/run.sh
          tools/pid/run.sh   # batch A, crack scenarios, 11-14 replay; fails if the competition replay misses 0.3 degC / 10 %

      - name: UI preview (desktop build of the real UI code)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/preview/build.sh
          build_preview/preview build_preview/shots

      - uses: actions/upload-artifact@v7
        with:
          name: ui-preview-${{ steps.pkg.outputs.ver }}
          path: build_preview/shots/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: cardputer-roast-${{ steps.pkg.outputs.ver }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.ver }}
          name: ${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per ref at a time: two quick merges to main publish their releases in order (the newer one is latest).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version counts the commits on main

      - name: Fetch components
        run: |
          git config --global --add safe.directory '*'
          python3 fetch_repos.py

      # Publish traceable native application artifacts; installation is managed by ESP Hub.
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then ver="v0.4.$(git rev-list --count HEAD)"
          else ver="esphub-$(git rev-parse --short HEAD)"; fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "version ${ver}"

      - name: Build
        shell: bash
        env:
          ROAST_VERSION: ${{ steps.ver.outputs.ver }}
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Package ESP Hub native application
        id: pkg
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.ver }}"
          mkdir -p dist
          cp build/cardputer-roast.bin "dist/cardputer-roast-${ver}.bin"
          python3 tools/verify_esphub_image.py "dist/cardputer-roast-${ver}.bin" "$ver"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Unit tests (host)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/tests/run.sh
          tools/pid/run.sh   # batch A, crack scenarios, 11-14 replay; fails if the competition replay misses 0.3 degC / 10 %

      - name: UI preview (desktop build of the real UI code)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/preview/build.sh
          build_preview/preview build_preview/shots

      - uses: actions/upload-artifact@v7
        with:
          name: ui-preview-${{ steps.pkg.outputs.ver }}
          path: build_preview/shots/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: cardputer-roast-${{ steps.pkg.outputs.ver }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.ver }}
          name: ${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  dropbox-pages:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Dropbox-only setup page
        run: |
          mkdir public
          cp tools/dropbox-setup.html public/index.html
          cp tools/dropbox-setup.html public/dropbox-setup.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish setup page
        id: deploy
        uses: actions/deploy-pages@v4

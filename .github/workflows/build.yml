name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v7

      - name: Fetch components
        run: |
          git config --global --add safe.directory '*'
          python3 fetch_repos.py

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Package Launcher app image
        id: pkg
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME}"; else ver="$(git rev-parse --short HEAD)"; fi
          mkdir -p dist
          cp build/cardputer-roast.bin "dist/cardputer-roast-${ver}.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Unit tests (host)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/tests/run.sh

      - name: UI preview (desktop build of the real UI code)
        shell: bash
        run: |
          command -v g++ >/dev/null || (apt-get update -qq && apt-get install -y -qq g++ >/dev/null)
          tools/preview/build.sh
          build_preview/preview build_preview/shots

      - uses: actions/upload-artifact@v7
        with:
          name: ui-preview-${{ steps.pkg.outputs.ver }}
          path: build_preview/shots/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: cardputer-roast-${{ steps.pkg.outputs.ver }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
